<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="stylesheet" href="./assets/style.css" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | Social links profile</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  </head>
  <body>
    <main>
      <section class="profile">
        <div class="pp">
          <img src="./assets/images/avatar-jessica.jpeg" />
        </div>
        <div class="profile-name">
          <h1 class="name">Jessica Randall</h1>
          <p class="city">London, United Kingdom</p>
        </div>
        <p class="about">"Front-end developer and avid reader."</p>
      </section>

      <section class="profile-links">
        <ul>
          <li class="link"><a class="links">Github</a></li>
          <li class="link"><a class="links">Frontend Mentor</a></li>
          <li class="link"><a class="links">LinkedIn</a></li>
          <li class="link"><a class="links">Twitter</a></li>
          <li class="link"><a class="links">Instagram</a></li>
        </ul>
      </section>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Chukwuma Cecilia</a>.
    </footer>
  </body>
</html>
